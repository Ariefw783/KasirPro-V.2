<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <style>
      .b-outline { fill: none; stroke: #0f2a43; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .b-inner   { fill: none; stroke: #0284c7; stroke-width: 1.0; stroke-linecap: round; opacity: 0.85; }
      .b-fine    { fill: none; stroke: #0d9488; stroke-width: 0.8; stroke-linecap: round; stroke-dasharray: 1.5 2.5; opacity: 0.9; }
      .b-fill    { fill: #0f2a43; opacity: 0.04; }
      .b-dot     { fill: #0f2a43; }
      .b-accent  { fill: #0284c7; }
    </style>
  </defs>

  <!-- ================= BACKGROUND SHADING ================= -->
  <!-- Center Kawung Flower Petals Fill -->
  <path class="b-fill" d="M 50 12 C 65 24 65 38 50 50 C 35 38 35 24 50 12 Z"/>
  <path class="b-fill" d="M 50 88 C 65 76 65 62 50 50 C 35 62 35 76 50 88 Z"/>
  <path class="b-fill" d="M 88 50 C 76 65 62 65 50 50 C 62 35 76 35 88 50 Z"/>
  <path class="b-fill" d="M 12 50 C 24 65 38 65 50 50 C 38 35 24 35 12 50 Z"/>

  <!-- ================= CENTER KAWUNG PETALS (OUTLINE) ================= -->
  <!-- North Petal -->
  <path class="b-outline" d="M 50 12 C 65 24 65 38 50 50 C 35 38 35 24 50 12 Z"/>
  <path class="b-inner"   d="M 50 18 C 60 27 60 37 50 46 C 40 37 40 27 50 18 Z"/>
  <circle cx="50" cy="27" r="1.6" class="b-dot"/>
  <circle cx="50" cy="35" r="1.6" class="b-dot"/>

  <!-- South Petal -->
  <path class="b-outline" d="M 50 88 C 65 76 65 62 50 50 C 35 62 35 76 50 88 Z"/>
  <path class="b-inner"   d="M 50 82 C 60 73 60 63 50 54 C 40 63 40 73 50 82 Z"/>
  <circle cx="50" cy="73" r="1.6" class="b-dot"/>
  <circle cx="50" cy="65" r="1.6" class="b-dot"/>

  <!-- East Petal -->
  <path class="b-outline" d="M 88 50 C 76 65 62 65 50 50 C 62 35 76 35 88 50 Z"/>
  <path class="b-inner"   d="M 82 50 C 73 60 63 60 54 50 C 63 40 73 40 82 50 Z"/>
  <circle cx="73" cy="50" r="1.6" class="b-dot"/>
  <circle cx="65" cy="50" r="1.6" class="b-dot"/>

  <!-- West Petal -->
  <path class="b-outline" d="M 12 50 C 24 65 38 65 50 50 C 38 35 24 35 12 50 Z"/>
  <path class="b-inner"   d="M 18 50 C 27 60 37 60 46 50 C 37 40 27 40 18 50 Z"/>
  <circle cx="27" cy="50" r="1.6" class="b-dot"/>
  <circle cx="35" cy="50" r="1.6" class="b-dot"/>

  <!-- Center Cecek & Diamond (Inti Kawung) -->
  <polygon points="50,45 54,50 50,55 46,50" class="b-dot"/>
  <circle cx="50" cy="50" r="1.5" fill="#ffffff"/>

  <!-- ================= SEAMLESS CORNER PETALS ================= -->
  <!-- Top-Left Corner (0,0) -->
  <path class="b-outline" d="M 38 0 C 24 15 12 15 0 0 C 12 -15 24 -15 38 0 Z"/>
  <path class="b-inner"   d="M 32 0 C 21 10 11 10 0 0 C 11 -10 21 -10 32 0 Z"/>
  <path class="b-outline" d="M 0 38 C 15 24 15 12 0 0 C -15 12 -15 24 0 38 Z"/>
  <path class="b-inner"   d="M 0 32 C 10 21 10 11 0 0 C -10 11 -10 21 0 32 Z"/>
  <circle cx="0" cy="0" r="3.2" class="b-dot"/>
  <circle cx="23" cy="0" r="1.5" class="b-dot"/>
  <circle cx="0" cy="23" r="1.5" class="b-dot"/>

  <!-- Top-Right Corner (100,0) -->
  <path class="b-outline" d="M 62 0 C 76 15 88 15 100 0 C 88 -15 76 -15 62 0 Z"/>
  <path class="b-inner"   d="M 68 0 C 79 10 89 10 100 0 C 89 -10 79 -10 68 0 Z"/>
  <path class="b-outline" d="M 100 38 C 85 24 85 12 100 0 C 115 12 115 24 100 38 Z"/>
  <path class="b-inner"   d="M 100 32 C 90 21 90 11 100 0 C 110 11 110 21 100 32 Z"/>
  <circle cx="100" cy="0" r="3.2" class="b-dot"/>
  <circle cx="77" cy="0" r="1.5" class="b-dot"/>
  <circle cx="100" cy="23" r="1.5" class="b-dot"/>

  <!-- Bottom-Left Corner (0,100) -->
  <path class="b-outline" d="M 38 100 C 24 85 12 85 0 100 C 12 115 24 115 38 100 Z"/>
  <path class="b-inner"   d="M 32 100 C 21 90 11 90 0 100 C 11 110 21 110 32 100 Z"/>
  <path class="b-outline" d="M 0 62 C 15 76 15 88 0 100 C -15 88 -15 76 0 62 Z"/>
  <path class="b-inner"   d="M 0 68 C 10 79 10 89 0 100 C -10 89 -10 79 0 68 Z"/>
  <circle cx="0" cy="100" r="3.2" class="b-dot"/>
  <circle cx="23" cy="100" r="1.5" class="b-dot"/>
  <circle cx="0" cy="77" r="1.5" class="b-dot"/>

  <!-- Bottom-Right Corner (100,100) -->
  <path class="b-outline" d="M 62 100 C 76 85 88 85 100 100 C 88 115 76 115 62 100 Z"/>
  <path class="b-inner"   d="M 68 100 C 79 90 89 90 100 100 C 89 110 79 110 68 100 Z"/>
  <path class="b-outline" d="M 100 62 C 85 76 85 88 100 100 C 115 88 115 76 100 62 Z"/>
  <path class="b-inner"   d="M 100 68 C 90 79 90 89 100 100 C 110 89 110 79 100 68 Z"/>
  <circle cx="100" cy="100" r="3.2" class="b-dot"/>
  <circle cx="77" cy="100" r="1.5" class="b-dot"/>
  <circle cx="100" cy="77" r="1.5" class="b-dot"/>

  <!-- ================= INTERSECTION ORNAMENTS (MELATI / CECEK SALIB) ================= -->
  <!-- Quadrant 1 (75, 25) -->
  <circle cx="75" cy="25" r="2.5" class="b-accent"/>
  <circle cx="75" cy="19" r="1.2" class="b-dot"/>
  <circle cx="75" cy="31" r="1.2" class="b-dot"/>
  <circle cx="69" cy="25" r="1.2" class="b-dot"/>
  <circle cx="81" cy="25" r="1.2" class="b-dot"/>
  <polygon points="75,21 79,25 75,29 71,25" class="b-fine"/>

  <!-- Quadrant 2 (25, 25) -->
  <circle cx="25" cy="25" r="2.5" class="b-accent"/>
  <circle cx="25" cy="19" r="1.2" class="b-dot"/>
  <circle cx="25" cy="31" r="1.2" class="b-dot"/>
  <circle cx="19" cy="25" r="1.2" class="b-dot"/>
  <circle cx="31" cy="25" r="1.2" class="b-dot"/>
  <polygon points="25,21 29,25 25,29 21,25" class="b-fine"/>

  <!-- Quadrant 3 (25, 75) -->
  <circle cx="25" cy="75" r="2.5" class="b-accent"/>
  <circle cx="25" cy="69" r="1.2" class="b-dot"/>
  <circle cx="25" cy="81" r="1.2" class="b-dot"/>
  <circle cx="19" cy="75" r="1.2" class="b-dot"/>
  <circle cx="31" cy="75" r="1.2" class="b-dot"/>
  <polygon points="25,71 29,75 25,79 21,75" class="b-fine"/>

  <!-- Quadrant 4 (75, 75) -->
  <circle cx="75" cy="75" r="2.5" class="b-accent"/>
  <circle cx="75" cy="69" r="1.2" class="b-dot"/>
  <circle cx="75" cy="81" r="1.2" class="b-dot"/>
  <circle cx="69" cy="75" r="1.2" class="b-dot"/>
  <circle cx="81" cy="75" r="1.2" class="b-dot"/>
  <polygon points="75,71 79,75 75,79 71,75" class="b-fine"/>
</svg>
