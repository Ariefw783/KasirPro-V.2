<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f2a43">
    <meta name="description" content="KasirPro sedang dibuka tanpa koneksi internet.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <title>KasirPro | Offline</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef2f6;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:34px;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(15,42,67,.14);text-align:center}.logo{width:112px;height:112px;object-fit:contain;margin-bottom:16px}h1{margin:0 0 10px;color:#0f2a43;font-size:1.7rem}p{margin:0 0 24px;line-height:1.6;color:#536174}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}a,button{border:0;border-radius:11px;padding:12px 18px;font:700 14px/1 system-ui;cursor:pointer;text-decoration:none}.primary{background:#0f2a43;color:#fff}.secondary{background:#e8eef4;color:#0f2a43}
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="assets/logo.png" alt="Logo KasirPro">
        <h1>KasirPro sedang offline</h1>
        <p>Halaman yang pernah dibuka tetap tersedia. Periksa koneksi jika halaman tujuan belum tersimpan di perangkat ini.</p>
        <div class="actions">
            <a class="primary" href="index.html">Buka Login</a>
            <a class="secondary" href="pos/index.html">Buka POS</a>
            <button class="secondary" type="button" onclick="location.reload()">Coba Lagi</button>
        </div>
    </main>
</body>
</html>
