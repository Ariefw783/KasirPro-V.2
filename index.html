<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Gateway aplikasi KasirPro untuk Administrator dan Petugas Kasir."
    >

    <meta
        name="theme-color"
        content="#0f2a43"
    >

    <title>KasirPro | Login</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-180.png">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
    <link rel="stylesheet" href="login-theme.css?v=20260829-background-4">
</head>

<body>
  <main class="login-page">
    <section class="login-container" aria-labelledby="login-title">
      <aside class="brand-stage">
        <header class="login-header">
          <img src="assets/kasirpro-symbol.svg" alt="" class="login-logo" aria-hidden="true">
          <div class="login-brand">
            <h1 id="login-title" aria-label="KasirPro V.2">
              <span class="brand-kasir">KASIR</span><span class="brand-pro">PRO</span><span class="brand-version">V.2</span>
            </h1>
            <p id="login-store-name">Apotek Doa Ibu</p>
          </div>
        </header>
      </aside>

      <section class="auth-stage">
        <section class="login-card-shell" aria-labelledby="role-title">
          <section class="role-selection">
            <div class="section-heading">
              <h2 id="role-title">Selamat Datang</h2>
            </div>
            <div class="role-grid" role="tablist" aria-label="Pilih mode masuk">
              <button type="button" class="role-card role-admin active" data-role="admin" aria-pressed="true">
                <strong>Administrator</strong>
              </button>
              <button type="button" class="role-card role-cashier" data-role="cashier" aria-pressed="false">
                <strong>Kasir</strong>
              </button>
            </div>
          </section>

          <section id="login-panel" class="login-panel" aria-labelledby="form-title">
            <div class="section-heading login-panel-heading" hidden>
              <button type="button" id="back-role-button" class="back-button"><span>Kembali</span></button>
              <h2 id="form-title">Masuk</h2>
              <p id="selected-role-label"></p>
            </div>
            <form id="login-form" autocomplete="on">
              <div id="username-wrapper" class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                  <span class="input-icon" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
                  <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
                </div>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                  <div class="input-wrapper password-input-wrapper">
                    <span class="input-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required>
                  </div>
                  <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan kata sandi">
                    <i id="password-icon" class="fa-solid fa-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>
              <button type="submit" id="login-submit" class="login-submit">
                <span id="login-submit-icon" class="login-submit-icon"><i class="fa-solid fa-right-to-bracket"></i></span>
                <span id="login-submit-text">Masuk</span>
              </button>
            </form>
          </section>
        </section>
      </section>
    </section>
  </main>
  <div id="app-loading" class="app-loading" role="status" aria-live="polite" hidden>
    <div class="app-loading-card"><i class="fa-solid fa-spinner"></i><strong>Memuat data KasirPro</strong><span>Mohon tunggu, data sedang disinkronkan.</span></div>
  </div>
  <script src="pwa.js" defer></script>
  <script type="module" src="script.js?v=20260829-background-4"></script>
</body>
</html>
